Description: Device Measurements Populator Application
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  targetCluster:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of the SSM parameter holding the ECS cluster this application runs in
  dockerTag:
    Type: String
    Description: Docker tag to deploy
  devicesTableName:
    Type: String
    Description: DynamoDB Table Name to store devices
  productDescriptorsTableName:
    Type: String
    Description: DynamoDB Table Name to store product descriptors
  deviceFileDataBucket:
    Type: String
    Description: S3 Bucket Name to store measured device files
  expireFileDataTable:
    Type: String
    Description: DynamoDb table referencing measured device files due for removal
  productDescriptorsTableIndex:
    Type: String
    Description: DynamoDb index of product descriptors
  albTargetGroupArnExport:
    Type: String
    Description: Name of the CloudFormation export holding this service's ALB target group ARN
  legacyAlbTargetGroupArn:
    Type: String
    Default: ''
    Description: >-
      ARN of a second, pre-existing target group to register this service with alongside the one above.
      Supplying it lets a consumer be repointed from one load balancer to the other without a window in
      which neither answers; leaving it empty registers the service with the target group above alone.

Conditions:
  # Keyed on whether a second target group was supplied rather than on an environment name: what varies
  # is the routing, and an environment is only a proxy for it. Retiring the second target group is then
  # a matter of ceasing to supply it.
  isDualHomed: !Not [!Equals [!Ref legacyAlbTargetGroupArn, '']]

Resources:
  taskDefinitionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: deviceMeasurementsPopulatorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'expireFileDataTable'
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'devicesTableName'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'productDescriptorsTableName'
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'productDescriptorsTableName'
                    - /index/
                    - !Ref 'productDescriptorsTableIndex'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Join
                    - ''
                    - - 'arn:aws:s3:::'
                      - !Ref 'deviceFileDataBucket'
                  - !Join
                    - ''
                    - - 'arn:aws:s3:::'
                      - !Ref 'deviceFileDataBucket'
                      - /*
  taskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      TaskRoleArn: !GetAtt 'taskDefinitionRole.Arn'
      ContainerDefinitions:
        - Name: device-measurements-populator
          Cpu: '1'
          Essential: 'true'
          Image: !Join
            - ''
            - - 'docker.io/linn/device-measurements-populator:'
              - !Ref 'dockerTag'
          Memory: '100'
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: DEVICES_TABLE_NAME
              Value: !Ref 'devicesTableName'
            - Name: PRODUCT_DESCRIPTORS_TABLE_NAME
              Value: !Ref 'productDescriptorsTableName'
            - Name: PRODUCT_DESCRIPTORS_TABLE_INDEX
              Value: !Ref 'productDescriptorsTableIndex'
            - Name: EXPIRE_S3_OBJECTS_TABLE_NAME
              Value: !Ref 'expireFileDataTable'
            - Name: DEVICE_FILE_DATA_BUCKET
              Value: !Ref 'deviceFileDataBucket'
            - Name: NODE_ENV
              Value: release
            - Name: PORT
              Value: '3000'
  service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref 'targetCluster'
      DesiredCount: '1'
      TaskDefinition: !Ref 'taskDefinition'
      # No Role. A service registered with more than one target group must use the ECS service-linked
      # role, which is what is used when Role is absent; naming a custom service role caps the service
      # at one target group.
      LoadBalancers: !If
        - isDualHomed
        - - ContainerName: device-measurements-populator
            ContainerPort: 3000
            TargetGroupArn:
              Fn::ImportValue: !Ref albTargetGroupArnExport
          - ContainerName: device-measurements-populator
            ContainerPort: 3000
            TargetGroupArn: !Ref legacyAlbTargetGroupArn
        - - ContainerName: device-measurements-populator
            ContainerPort: 3000
            TargetGroupArn:
              Fn::ImportValue: !Ref albTargetGroupArnExport
