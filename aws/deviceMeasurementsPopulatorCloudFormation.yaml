Description: Device Measurements Populator Application
AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  targetCluster:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Name of the SSM parameter holding the ECS cluster this application runs in
  dockerTag:
    Type: String
    Description: Docker tag to deploy
  devicesTableName:
    Type: String
    Description: DynamoDB Table Name to store devices
  productDescriptorsTableName:
    Type: String
    Description: DynamoDB Table Name to store product descriptors
  deviceFileDataBucket:
    Type: String
    Description: S3 Bucket Name to store measured device files
  expireFileDataTable:
    Type: String
    Description: DynamoDb table referencing measured device files due for removal
  productDescriptorsTableIndex:
    Type: String
    Description: DynamoDb index of product descriptors
  albTargetGroupArnExport:
    Type: String
    Description: Name of the CloudFormation export holding this service's ALB target group ARN
  legacyAlbTargetGroupArn:
    Type: String
    MinLength: 1
    AllowedPattern: '^none$|^arn:aws:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:targetgroup/[A-Za-z0-9-]{1,32}/[0-9a-f]{16}$'
    ConstraintDescription: >-
      must be either the lowercase word none, or an elasticloadbalancing target-group ARN in the aws
      partition. An empty value is rejected by MinLength rather than by the pattern, which
      CloudFormation does not apply to an empty string - say none to mean it.
    Description: >-
      ARN of a second, pre-existing target group to register this service with alongside the one above,
      or the word none. Supplying an ARN lets a consumer be repointed from one load balancer to the other
      without a window in which neither answers.
      Deliberately has NO default, and the pattern rejects an empty string: a caller must state which it
      means. Every deploy must pass this explicitly - `aws cloudformation deploy` sends
      UsePreviousValue for any parameter it is not given, so on an existing stack an omitted value is
      retained rather than reset, and dual-homing set once by hand would otherwise persist unnoticed
      through every later deploy.

Conditions:
  # Keyed on whether a second target group was supplied rather than on an environment name: what varies
  # is the routing, and an environment is only a proxy for it.
  isDualHomed: !Not [!Equals [!Ref legacyAlbTargetGroupArn, 'none']]

Resources:
  taskDefinitionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: deviceMeasurementsPopulatorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'expireFileDataTable'
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'devicesTableName'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'productDescriptorsTableName'
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Join
                  - ''
                  - - 'arn:aws:dynamodb:'
                    - !Ref 'AWS::Region'
                    - :545349016803:table/
                    - !Ref 'productDescriptorsTableName'
                    - /index/
                    - !Ref 'productDescriptorsTableIndex'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Join
                    - ''
                    - - 'arn:aws:s3:::'
                      - !Ref 'deviceFileDataBucket'
                  - !Join
                    - ''
                    - - 'arn:aws:s3:::'
                      - !Ref 'deviceFileDataBucket'
                      - /*
  taskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      TaskRoleArn: !GetAtt 'taskDefinitionRole.Arn'
      ContainerDefinitions:
        - Name: device-measurements-populator
          Cpu: '1'
          Essential: 'true'
          Image: !Join
            - ''
            - - 'docker.io/linn/device-measurements-populator:'
              - !Ref 'dockerTag'
          MemoryReservation: 200
          # 512, carried from master rather than this branch's 400. The hard limit was raised from 100
          # on 2026-09-02 while this branch was open; taking the branch's lower number would quietly
          # undo that, and a hard limit is not something to reduce as a side effect of a file move.
          Memory: 512
          PortMappings:
            - ContainerPort: 3000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub '/ecs/${AWS::StackName}'
              awslogs-region: !Ref 'AWS::Region'
              # Without this every stream is named after the container id, so a failed task ARN cannot
              # be traced to the output that explains it.
              awslogs-stream-prefix: populator
              # The container must not stall on log delivery: a populator run is a long S3 and Dynamo
              # sweep, and blocking writes would make CloudWatch availability a dependency of the work
              # rather than of observing it.
              #
              # The cost, stated because it is not free: when the buffer fills, lines are DROPPED, and
              # the notice saying so is written to the Docker daemon log on the host - the unreachable
              # place this change exists to escape. The buffer is raised well above the 1MB default to
              # make that rare on a bursty sweep, not to make it impossible.
              mode: non-blocking
              max-buffer-size: 8m
          Environment:
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: DEVICES_TABLE_NAME
              Value: !Ref 'devicesTableName'
            - Name: PRODUCT_DESCRIPTORS_TABLE_NAME
              Value: !Ref 'productDescriptorsTableName'
            - Name: PRODUCT_DESCRIPTORS_TABLE_INDEX
              Value: !Ref 'productDescriptorsTableIndex'
            - Name: EXPIRE_S3_OBJECTS_TABLE_NAME
              Value: !Ref 'expireFileDataTable'
            - Name: DEVICE_FILE_DATA_BUCKET
              Value: !Ref 'deviceFileDataBucket'
            - Name: NODE_ENV
              Value: release
            - Name: PORT
              Value: '3000'
  # Declared, because the driver will not supply it: awslogs-create-group defaults to false, so a
  # missing group does not get invented - the container fails to start with ResourceNotFoundException.
  # Setting that option instead would create the group with NO retention, never expiring, which is the
  # estate-wide problem linn/linn-api-development#641 removed from eighteen groups. 30 days is the
  # retention that effort settled on.
  #
  # Named from the stack rather than an environment parameter: this template deliberately has no
  # environment input - its only conditional keys on the target-group arrangement instead. That keeps
  # sys distinct only as far as the stack name does: scripts/deploy.sh hardcodes
  # deviceMeasurementPopulator-sys and refuses every other environment, and prod is deployed by hand
  # (see issue #12), so prod's group name is whatever stack name the operator uses at cutover and is
  # not recorded anywhere here.
  serviceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30

  service:
    Type: AWS::ECS::Service
    # Ordered against the group because the group is a precondition for a task starting at all: with
    # awslogs-create-group left at its default, a driver that cannot find the group fails to
    # initialise and the task does not run. On the taskDefinition this would order nothing - a task
    # definition never runs anything - so it belongs here, on the resource that places tasks.
    #
    # The sibling device-measurements-api omits it and declares its group the same way; that is not
    # evidence the ordering is safe, only that it has not yet lost the race.
    DependsOn: serviceLogGroup
    Properties:
      Cluster: !Ref 'targetCluster'
      DesiredCount: '1'
      TaskDefinition: !Ref 'taskDefinition'
      # No Role. A service registered with more than one target group must use the ECS service-linked
      # role, which is what is used when Role is absent; naming a custom service role caps the service
      # at one target group.
      LoadBalancers:
        - ContainerName: device-measurements-populator
          ContainerPort: 3000
          TargetGroupArn:
            Fn::ImportValue: !Ref albTargetGroupArnExport
        # AWS::NoValue removes the element entirely, so the two registrations are stated once each
        # rather than a whole list per branch - nothing checks that duplicated copies of a container
        # name and port agree.
        - !If
          - isDualHomed
          - ContainerName: device-measurements-populator
            ContainerPort: 3000
            TargetGroupArn: !Ref legacyAlbTargetGroupArn
          - !Ref 'AWS::NoValue'
